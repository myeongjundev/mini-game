<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c10" />
    <title>SOC SHIFT:30 — BGM PREVIEW</title>
    <style>
      :root {
        color: #f0a93b;
        background: #0a0c10;
        font-family: "Courier New", monospace;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background:
          repeating-linear-gradient(0deg, transparent 0 3px, #12161d 4px),
          #0a0c10;
      }
      main {
        width: min(100%, 520px);
        border: 2px solid #232b36;
        padding: 24px;
        background: #12161d;
        box-shadow: 8px 8px 0 #0a0c10;
      }
      .eyebrow, .status { color: #6fcf6b; }
      h1 { margin: 8px 0; font-size: clamp(24px, 8vw, 42px); }
      h2 { margin: 0 0 24px; color: #e2564d; font-size: 15px; }
      p { line-height: 1.55; }
      audio { width: 100%; margin: 18px 0; accent-color: #f0a93b; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; }
      dt { color: #6fcf6b; }
      dd { margin: 0; text-align: right; }
      a { color: #f0a93b; }
      .note { margin-top: 22px; color: #aab3be; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">● AUDIO NODE // ONLINE</div>
      <h1>NIGHT WATCH PULSE</h1>
      <h2>SOC SHIFT:30 — BGM 01</h2>
      <p>아래 재생 버튼을 누르면 30초 게임 루프용 BGM 시안을 들을 수 있습니다.</p>
      <audio controls loop preload="metadata">
        <source src="./soc-shift-night-watch-loop.wav" type="audio/wav" />
        이 브라우저에서는 WAV 재생을 지원하지 않습니다.
      </audio>
      <dl>
        <dt>LENGTH</dt><dd>00:30</dd>
        <dt>TEMPO</dt><dd>96 BPM</dd>
        <dt>MODE</dt><dd>D MINOR</dd>
        <dt>LOOP</dt><dd>ENABLED</dd>
      </dl>
      <p class="status">READY // TAP PLAY</p>
      <p class="note"><a href="../">게임으로 돌아가기</a> · 모바일 자동 재생 제한 때문에 직접 재생 버튼을 눌러야 합니다.</p>
    </main>
  </body>
</html>
