name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aleph-t02-soc-shift30
    steps:
      - uses: actions/checkout@v4

      # vite 8 / plugin-react 6은 node ^20.19.0 || >=22.12.0을 요구한다.
      # 개발 환경(v24)과 맞춰 24로 고정한다.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aleph-t02-soc-shift30/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # vite.config.ts의 outDir이 '../site'이므로 산출물은 저장소 루트의 site/에 생긴다
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
